<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tri Before Xmas</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="london-frontrunners.webp" alt="London Frontrunners" class="logo" width="163" height="44">
      <div>
      <h1>Tri Before Xmas</h1>
      <p id="route-name" class="muted">Loading route…</p>
      </div>
    </div>
    <div class="status">
      <span id="last-update" class="muted"></span>
      <button id="refresh-btn" type="button" title="Fetch the latest totals from the spreadsheet">Refresh</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div id="map" aria-label="Race map"></div>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="leaderboard" class="active">Leaderboard</button>
        <button role="tab" data-tab="team">Team</button>
        <button role="tab" data-tab="weekly">Weekly</button>
        <button role="tab" data-tab="disciplines">Disciplines</button>
      </nav>

      <div id="error-banner" class="error" hidden></div>
      <div id="check-banner" class="warn" hidden></div>

      <section id="tab-leaderboard" class="tab-body">
        <ol id="leaderboard" class="leaderboard"></ol>
        <p id="empty" class="muted" hidden>No team totals yet. They'll appear after the first successful spreadsheet refresh.</p>
      </section>

      <section id="tab-team" class="tab-body" hidden>
        <label class="select-row">Team
          <select id="team-select"></select>
        </label>
        <div id="team-detail"></div>
      </section>

      <section id="tab-weekly" class="tab-body" hidden>
        <p id="weekly-note" class="muted" style="font-size:.8rem"></p>
        <div class="table-scroll"><table id="weekly-table" class="compact"></table></div>
      </section>

      <section id="tab-disciplines" class="tab-body" hidden>
        <div id="discipline-bars"></div>
      </section>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
